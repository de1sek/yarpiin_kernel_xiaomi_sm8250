name: Build Kernel (thyme / Mi 10S / SM8250, NotZeetaa CAF_MSM)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型 defconfig 名（Mi 10S 对应代号）'
        required: true
        default: 'thyme'
      kernelsu:
        description: '是否集成 KernelSU'
        type: boolean
        required: false
        default: false
      localversion:
        description: '追加到内核版本号末尾的自定义后缀（强烈建议非空，避免和官方固件版本号撞车导致 APatch 之类的工具误判为同一个镜像）'
        required: false
        default: 'selfbuild'

  push:
    branches:
      - 'CAF_MSM'
      # 这里指的是"这份 workflow 文件所在仓库"的哪个分支被 push 会触发它，
      # 跟下面 checkout 步骤里 ref 指定"去哪里拉代码"是两回事。
      # 如果你是把这份 workflow 放进自己 fork 的 NotZeetaa/android_kernel_xiaomi_sm8250
      # 里（分支名照抄成 CAF_MSM），这里天然就是对的；如果是放在别的仓库/别的分支名，改成对应的名字。

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: ${{ github.event.inputs.device || 'thyme' }}
  KERNELSU: ${{ github.event.inputs.kernelsu || 'false' }}
  LOCALVERSION: ${{ github.event.inputs.localversion || 'selfbuild' }}
  OUT_DIR: out
  # 内核源码：NotZeetaa/android_kernel_xiaomi_sm8250 的 CAF_MSM 分支。
  # 已经和之前用的 de1sek/yarpiin_kernel_xiaomi_sm8250 逐项核对过源码：
  # build.config.common / build.config.aarch64 完全一致（同样 BRANCH=android-4.19-stable，
  # 同样写死 clang-r399163b，同样 CROSS_COMPILE_COMPAT=arm-linux-gnueabi-），
  # vdso32/Makefile 的 --prefix= 那一行、camera_v2 的 gcc-version.sh 调用、
  # lib/string.c 的 stpcpy 实现也都一样。所以下面工具链拉取/校验的部分不用改，
  # 跟之前那份是同一套。
  KERNEL_REPO: NotZeetaa/android_kernel_xiaomi_sm8250
  KERNEL_REF: CAF_MSM
  # 不用 proton-clang，改用官方 AOSP 内核构建用的 clang 快照。
  # build.config.common 里写死的是 clang-r399163b；
  # master-kernel-build-2021 分支是 Google 官方仓库里专门给这个时期内核构建用的分支。
  CLANG_DIR: /opt/clang-official
  # prebuilts/clang/host/linux-x86 这个仓库在 master-kernel-build-2021 分支下
  # 同时塞了好几个版本（clang-r399163b / clang-r416183b / clang-r416183c /
  # clang-r383902 / clang-stable / clang-3289846……），必须显式指定要用哪一个，
  # 不能靠 find 随便搜到一个就用——那样命中哪个版本是不确定的。
  # 这里对应 build.config.common 里写死的 clang-r399163b。
  CLANG_VERSION: clang-r399163b
  GAS_DIR: /opt/gas-official

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 释放构建机磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: 检出内核源码 (NotZeetaa/android_kernel_xiaomi_sm8250, CAF_MSM 分支)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          # 如果这份 workflow 文件本身就直接放在你 fork 的 NotZeetaa 仓库里跑，
          # 上面这两行 repository/ref 删掉也没事，默认就是当前仓库当前分支；
          # 留着的好处是不管这份 workflow 放在哪个仓库里，源码永远固定拉这一份。
          fetch-depth: 1
          # 之前是 0（拉全部分支 + 全部历史，一个内核仓库单是一个 commit 的量
          # 打包下来就有 200 多 MB，全历史只会更大）。这份 defconfig 没开
          # CONFIG_LOCALVERSION_AUTO，LOCALVERSION 也是靠下面那一步手动写入的，
          # 完全不需要 git 历史，改成 1 只拉最新一个 commit，省掉大头的 checkout 时间。
          submodules: recursive
          # 这份源码根目录没有 .gitmodules，目前是空操作、不产生耗时，
          # 保留是为了以后万一加了子模块也不用回来改这里。

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            build-essential kmod cpio rsync \
            git curl ca-certificates \
            python3 python-is-python3 ccache \
            binutils-arm-linux-gnueabi
          # 说明：binutils-arm-linux-gnueabi 是专门为了补上 arm-linux-gnueabi-ld。
          # 内核编译 32 位兼容 vDSO（vdso32）那一步是 Makefile 里硬编码直接调用
          # $(CROSS_COMPILE_COMPAT)ld（即 arm-linux-gnueabi-ld），不走我们 make 时
          # 显式指定的 LD=ld.lld。而我们用的两套官方工具链里都没有这个文件：
          # prebuilts/gas/linux-x86 官方仓库只含 as 和 elfedit，没有 ld；
          # 官方 clang 包自带的也只是 ld.lld，不是这个交叉版 GNU ld。
          # 所以用 apt 装一个真正的 GNU binutils 来补这一个缺口，
          # 其余的 AR/NM/OBJCOPY/OBJDUMP/STRIP 仍然显式指向 LLVM 工具，不受影响。

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEVICE }}-${{ env.KERNEL_REF }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-${{ env.KERNEL_REF }}-

      - name: 缓存官方 Clang 工具链
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: official-clang-r399163b-v1

      - name: 拉取官方 Clang（clang-r399163b，master-kernel-build-2021 分支）
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${{ env.CLANG_DIR }}"

      - name: 定位官方 Clang 实际的 bin 目录
        run: |
          CLANG_BIN_DIR="${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}/bin"
          if [ ! -x "$CLANG_BIN_DIR/clang" ]; then
            echo "::error::没有找到 $CLANG_BIN_DIR/clang。CLANG_VERSION=${{ env.CLANG_VERSION }} 这个版本目录在当前分支下可能不存在了。"
            echo "该分支下实际存在的版本目录有："
            find "${{ env.CLANG_DIR }}" -maxdepth 1 -type d -name 'clang-*'
            exit 1
          fi
          echo "使用: $CLANG_BIN_DIR"
          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> "$GITHUB_ENV"

      - name: 缓存官方 GNU as 兜底工具
        id: gas-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GAS_DIR }}
          key: official-gas-v1

      - name: 拉取官方 GNU as（兜底汇编器，非核心但保持和官方构建一致）
        if: steps.gas-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gas/linux-x86 \
            "${{ env.GAS_DIR }}" || echo "::warning::gas 兜底工具拉取失败，不影响主流程，继续执行"
          # prebuilts/gas/linux-x86 这个仓库的二进制直接放在仓库根目录
          # （aarch64-linux-gnu-as / arm-linux-gnueabi-as 等），没有 bin/ 这一层子目录，
          # 和 clang 仓库的结构不一样，下面直接把 $GAS_DIR 本身加进 PATH 即可。

      - name: 注册工具链到 PATH 并校验
        run: |
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"
          echo "${{ env.GAS_DIR }}" >> "$GITHUB_PATH"
          export PATH="$CLANG_BIN_DIR:${{ env.GAS_DIR }}:$PATH"
          echo "== 使用的 clang 路径 =="
          which clang
          echo "== clang --version =="
          clang --version
          echo "== 校验是否命中 r399163b（如果没匹配到，说明用错了 clang，直接失败而不是继续跑）=="
          clang --version | grep -q "399163" && echo "OK: 版本匹配 clang-r399163b" \
            || { echo "::error::clang --version 输出里没找到 399163 字样，说明 PATH 没有正确指向官方 clang（很可能又落到系统自带的 clang 了），停止构建。"; exit 1; }
          echo "== ld.lld --version（改用 LLVM 自带链接器）=="
          ld.lld --version || { echo "::error::ld.lld 不存在，检查 CLANG_BIN_DIR 是否指向正确的官方 clang bin 目录"; exit 1; }
          echo "== llvm-objdump --version =="
          llvm-objdump --version || { echo "::error::llvm-objdump 不存在，检查 CLANG_BIN_DIR 是否指向正确的官方 clang bin 目录"; exit 1; }
          echo "== aarch64-linux-gnu-as --version（来自 prebuilts/gas/linux-x86）=="
          aarch64-linux-gnu-as --version | head -n1
          echo "== arm-linux-gnueabi-as --version（32位兼容部分用的交叉汇编器）=="
          arm-linux-gnueabi-as --version | head -n1
          echo "== arm-linux-gnueabi-ld --version（vdso32 链接阶段硬编码调用，来自 apt 装的 binutils-arm-linux-gnueabi，不是官方两套工具链里的东西）=="
          arm-linux-gnueabi-ld --version | head -n1 || { echo "::error::arm-linux-gnueabi-ld 不存在，检查 binutils-arm-linux-gnueabi 是否装成功"; exit 1; }

      - name: 定位 ${{ env.DEVICE }} 的 defconfig（自动搜索，不写死路径）
        id: defconfig
        run: |
          FOUND="$(find arch/arm64/configs -type f -name "${DEVICE}_defconfig" | head -n1)"
          if [ -z "$FOUND" ]; then
            echo "::error::在 arch/arm64/configs 下没有找到 ${DEVICE}_defconfig。"
            echo "该分支下实际存在的 defconfig 有："
            find arch/arm64/configs -type f -name "*_defconfig"
            exit 1
          fi
          RELCFG="$(realpath --relative-to=arch/arm64/configs "$FOUND")"
          echo "命中: $FOUND  ->  make 目标名: $RELCFG"
          # 注：这份 NotZeetaa 源码里 thyme_defconfig 实际放在 arch/arm64/configs/vendor/
          # 下面（跟之前那份不带 vendor/ 子目录不一样）。find 是递归查找、RELCFG 是
          # 算出来的相对路径，两种目录结构都能正确处理，不用为这个改代码，已经验证过。
          echo "path=$FOUND"   >> "$GITHUB_OUTPUT"
          echo "target=$RELCFG" >> "$GITHUB_OUTPUT"

      - name: 追加自定义 LOCALVERSION（默认非空，避免版本号和官方固件撞车）
        if: ${{ env.LOCALVERSION != '' }}
        run: |
          echo 'CONFIG_LOCALVERSION="-${{ env.LOCALVERSION }}"' >> "${{ steps.defconfig.outputs.path }}"

      - name: 集成 KernelSU（可选，需在生成 .config 之前注入源码树）
        if: ${{ env.KERNELSU == 'true' }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: 修补 vdso32 --prefix=（仅在需要时生效，用官方工具链一般会被跳过）
        run: |
          F="arch/arm64/kernel/vdso32/Makefile"
          if grep -qF -- '--prefix=$(COMPAT_GCC_TOOLCHAIN_DIR)$(notdir' "$F"; then
            echo "已经是修复过的版本，跳过。"
          else
            sed -i 's/--prefix=\$(COMPAT_GCC_TOOLCHAIN_DIR)$/--prefix=$(COMPAT_GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE_COMPAT))/' "$F"
            grep -n -- '--prefix=' "$F"
          fi

      - name: 生成 .config
        run: |
          export PATH="$CLANG_BIN_DIR:${{ env.GAS_DIR }}:$PATH"
          make -j"$(nproc --all)" \
            ARCH=arm64 SUBARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            ${{ steps.defconfig.outputs.target }}

      - name: 若启用 KernelSU，则在 .config 中打开对应选项
        if: ${{ env.KERNELSU == 'true' }}
        run: |
          export PATH="$CLANG_BIN_DIR:${{ env.GAS_DIR }}:$PATH"
          scripts/config --file ${{ env.OUT_DIR }}/.config -e KSU
          make -j"$(nproc --all)" \
            ARCH=arm64 SUBARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: 编译内核（目标 Image.gz，会连带生成 Image）
        run: |
          export PATH="$CLANG_BIN_DIR:${{ env.GAS_DIR }}:$PATH"
          set -o pipefail
          make -j"$(nproc --all)" \
            ARCH=arm64 SUBARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz \
            2>&1 | tee build.log

      - name: 校验产物
        run: |
          IMG="${{ env.OUT_DIR }}/arch/arm64/boot/Image"
          IMGGZ="${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz"
          if [ ! -f "$IMG" ] || [ ! -f "$IMGGZ" ]; then
            echo "::error::Image / Image.gz 没有同时生成，编译失败，请查看 build-log 这份 artifact 排错。"
            ls -la ${{ env.OUT_DIR }}/arch/arm64/boot/ 2>/dev/null || true
            exit 1
          fi
          echo "已生成:"
          ls -la "$IMG" "$IMGGZ"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE }}
          path: build.log
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.DEVICE }}
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image
          retention-days: 14

      - name: 上传 Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.DEVICE }}
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz
          retention-days: 14
