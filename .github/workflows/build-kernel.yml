name: Build Kernel (thyme / Mi 10S - LSE Enabled)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型 defconfig 名'
        required: true
        default: 'thyme'
      localversion:
        description: '内核版本后缀'
        required: false
        default: 'selfbuild-lse'
      clang_version:
        description: 'Clang 版本 (推荐 r416183b)'
        required: false
        default: 'r416183b'

  push:
    branches:
      - 'CAF_MSM'

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: ${{ github.event.inputs.device || 'thyme' }}
  LOCALVERSION: ${{ github.event.inputs.localversion || 'selfbuild-lse' }}
  CLANG_VERSION: ${{ github.event.inputs.clang_version || 'r416183b' }}
  OUT_DIR: out
  KERNEL_REPO: NotZeetaa/android_kernel_xiaomi_sm8250
  KERNEL_REF: CAF_MSM
  CLANG_DIR: /opt/clang-official
  # 32 位兼容工具链前缀（vdso32 需要），与 CROSS_COMPILE_COMPAT 保持一致即可
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          fetch-depth: 1
          submodules: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          # 注意：CROSS_COMPILE=aarch64-linux-gnu- 需要 binutils-aarch64-linux-gnu
          # 提供 aarch64-linux-gnu-as / aarch64-linux-gnu-objdump 等工具；
          # 此前只装了 32 位兼容用的 binutils-arm-linux-gnueabi，
          # 导致 vdso 汇编阶段回退到宿主机 x86 版 as，报 "unrecognized option '-EL'"。
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential \
            kmod cpio rsync git curl ca-certificates python3 python-is-python3 ccache \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # 精确 key 按 commit 区分；restore-keys 兜底，
          # 即使当前 commit 没有缓存，也能复用上一次最接近的缓存做增量编译，
          # 否则每个新 commit 的 ccache 都是空的，起不到加速效果。
          key: ccache-${{ env.DEVICE }}-lse-${{ env.CLANG_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-lse-${{ env.CLANG_VERSION }}-

      - name: 缓存 Clang 工具链
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: official-clang-${{ env.CLANG_VERSION }}-v2

      - name: 拉取 Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${{ env.CLANG_DIR }}"

      - name: 设置工具链路径
        run: |
          # 注意：AOSP 该仓库内各版本目录均带 "clang-" 前缀，
          # 例如 clang-r416183b，而非单纯的 r416183b，
          # 此前未加前缀导致路径拼接错误、找不到 clang 可执行文件。
          CLANG_BIN_DIR="${{ env.CLANG_DIR }}/clang-${{ env.CLANG_VERSION }}/bin"
          if [ ! -x "$CLANG_BIN_DIR/clang" ]; then
            echo "::error::Clang clang-${{ env.CLANG_VERSION }} 未找到，请检查版本号或仓库目录结构"
            echo "已存在的目录列表："
            ls -la "${{ env.CLANG_DIR }}" || true
            exit 1
          fi
          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"

      - name: 校验工具链
        run: |
          clang --version
          ld.lld --version

      - name: 定位 defconfig
        id: defconfig
        run: |
          FOUND="$(find arch/arm64/configs -type f -name "${DEVICE}_defconfig" | head -n1)"
          if [ -z "$FOUND" ]; then
            echo "::error::未找到 ${DEVICE}_defconfig"
            exit 1
          fi
          RELCFG="$(realpath --relative-to=arch/arm64/configs "$FOUND")"
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "target=$RELCFG" >> "$GITHUB_OUTPUT"

      - name: 配置 defconfig（追加版本后缀）
        run: |
          echo 'CONFIG_LOCALVERSION="-${{ env.LOCALVERSION }}"' >> "${{ steps.defconfig.outputs.path }}"
          # CONFIG_ARM64_LSE_ATOMICS 在该 defconfig 中已经是 y，
          # 不再重复追加（避免多余的 "override: reassigning" 警告）。
          # 这里只做只读校验，确认没有被后续改动意外关掉。
          if grep -q '^CONFIG_ARM64_LSE_ATOMICS=y' "${{ steps.defconfig.outputs.path }}"; then
            echo "✅ 确认 defconfig 中 CONFIG_ARM64_LSE_ATOMICS=y"
          else
            echo "::warning::defconfig 中未找到 CONFIG_ARM64_LSE_ATOMICS=y，请确认是否符合预期"
          fi

      - name: 生成 .config
        run: |
          make -j$(nproc) ARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=${{ env.CROSS_COMPILE_ARM32 }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            ${{ steps.defconfig.outputs.target }}

      - name: 编译内核
        run: |
          set -o pipefail
          make -j$(nproc) ARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=${{ env.CROSS_COMPILE_ARM32 }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            Image.gz 2>&1 | tee build.log

      - name: 校验产物
        run: |
          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            echo "✅ 编译成功！"
            ls -lh ${{ env.OUT_DIR }}/arch/arm64/boot/
          else
            echo "❌ 编译失败，请查看日志"
            exit 1
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE }}-lse
          path: build.log
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.DEVICE }}-lse
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image
          retention-days: 14

      - name: 上传 Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.DEVICE }}-lse
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz
          retention-days: 14
