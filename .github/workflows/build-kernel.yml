name: Build Kernel (thyme / Mi 10S - LSE Enabled)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '目标机型 defconfig 名'
        required: true
        default: 'thyme'
      localversion:
        description: '内核版本后缀'
        required: false
        default: 'selfbuild-lse'
      clang_version:
        description: 'Clang 版本 (推荐 r416183b)'
        required: false
        default: 'r416183b'

  push:
    branches:
      - 'CAF_MSM'

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: ${{ github.event.inputs.device || 'thyme' }}
  LOCALVERSION: ${{ github.event.inputs.localversion || 'selfbuild-lse' }}
  CLANG_VERSION: ${{ github.event.inputs.clang_version || 'r416183b' }}
  OUT_DIR: out
  KERNEL_REPO: NotZeetaa/android_kernel_xiaomi_sm8250
  KERNEL_REF: CAF_MSM
  CLANG_DIR: /opt/clang-official
  GAS_DIR: /opt/gas-official

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          fetch-depth: 1
          submodules: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential \
            kmod cpio rsync git curl ca-certificates python3 python-is-python3 ccache \
            binutils-arm-linux-gnueabi

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEVICE }}-lse-${{ env.CLANG_VERSION }}-${{ github.sha }}

      - name: 缓存 Clang 工具链
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: official-clang-${{ env.CLANG_VERSION }}-v2

      - name: 拉取 Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${{ env.CLANG_DIR }}"

      - name: 设置工具链路径
        run: |
          CLANG_BIN_DIR="${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}/bin"
          if [ ! -x "$CLANG_BIN_DIR/clang" ]; then
            echo "::error::Clang ${{ env.CLANG_VERSION }} 未找到"
            exit 1
          fi
          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"
          echo "${{ env.GAS_DIR }}" >> "$GITHUB_PATH"

      - name: 校验工具链
        run: |
          clang --version
          ld.lld --version

      - name: 定位 defconfig
        id: defconfig
        run: |
          FOUND="$(find arch/arm64/configs -type f -name "${DEVICE}_defconfig" | head -n1)"
          if [ -z "$FOUND" ]; then
            echo "::error::未找到 ${DEVICE}_defconfig"
            exit 1
          fi
          RELCFG="$(realpath --relative-to=arch/arm64/configs "$FOUND")"
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "target=$RELCFG" >> "$GITHUB_OUTPUT"

      - name: 配置 defconfig（保留 LSE）
        run: |
          echo 'CONFIG_LOCALVERSION="-${{ env.LOCALVERSION }}"' >> "${{ steps.defconfig.outputs.path }}"
          echo 'CONFIG_ARM64_LSE_ATOMICS=y' >> "${{ steps.defconfig.outputs.path }}"
          echo "✅ 已保留 CONFIG_ARM64_LSE_ATOMICS=y"

      - name: 生成 .config
        run: |
          make -j$(nproc) ARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            ${{ steps.defconfig.outputs.target }}

      - name: 编译内核
        run: |
          set -o pipefail
          make -j$(nproc) ARCH=arm64 O=${{ env.OUT_DIR }} \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz 2>&1 | tee build.log

      - name: 校验产物
        run: |
          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            echo "✅ 编译成功！"
            ls -lh ${{ env.OUT_DIR }}/arch/arm64/boot/
          else
            echo "❌ 编译失败，请查看日志"
            exit 1
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE }}-lse
          path: build.log
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.DEVICE }}-lse
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image
          retention-days: 14

      - name: 上传 Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.DEVICE }}-lse
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz
          retention-days: 14
